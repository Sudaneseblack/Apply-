name: Build Wad Faisal APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1 - تحميل ملفات المستودع
      - name: Checkout
        uses: actions/checkout@v6


      # 2 - إعداد Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # 3 - إعداد Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'


      # 4 - تجهيز Android SDK
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"


      # 5 - إنشاء مشروع Android
      - name: Create Android Project
        run: |

          mkdir -p app/src/main/java/org/wadfaisal/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets


          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WadFaisalApp"
          include(":app")
          EOF


          # build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.4.0' apply false
          }
          EOF


          # gradle.properties
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


          # app/build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'org.wadfaisal.app'

              compileSdk 36

              defaultConfig {
                  applicationId 'org.wadfaisal.app'

                  minSdk 23
                  targetSdk 36

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF


          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="ود فيصل"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # MainActivity.java
          cat > app/src/main/java/org/wadfaisal/app/MainActivity.java <<'EOF'
          package org.wadfaisal.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          return openTelegram(
                              request.getUrl().toString()
                          );
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {

                          return openTelegram(url);
                      }
                  });

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }


              private boolean openTelegram(String url) {

                  if (url.startsWith("https://t.me/")
                          || url.startsWith("http://t.me/")
                          || url.startsWith("tg://")) {

                      try {

                          Intent intent = new Intent(
                                  Intent.ACTION_VIEW,
                                  Uri.parse(url)
                          );

                          startActivity(intent);

                      } catch (Exception ignored) {
                      }

                      return true;
                  }

                  return false;
              }


              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }


              @Override
              protected void onDestroy() {

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF


          # styles.xml
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#168CFF</item>

                  <item name="android:statusBarColor">
                      #050B14
                  </item>

                  <item name="android:navigationBarColor">
                      #050B14
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:windowLightNavigationBar">
                      false
                  </item>

              </style>

          </resources>
          EOF


          # أيقونة التطبيق
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#168CFF"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M80,29L67,82C66,86 63,87 60,85L46,74L39,81C38,82 37,83 35,83L36,68L64,43C65,42 64,41 62,42L27,64L12,59C9,58 9,56 13,54L75,30C78,29 81,27 80,29Z" />

          </vector>
          EOF


      # 6 - نسخ ملفات التطبيق HTML
      - name: Copy Web App
        run: |

          cp index.html app/src/main/assets/index.html
          cp style.css app/src/main/assets/style.css
          cp script.js app/src/main/assets/script.js


      # 7 - بناء APK
      - name: Build APK
        run: |
          gradle assembleDebug


      # 8 - رفع APK كملف قابل للتنزيل
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Wad-Faisal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
